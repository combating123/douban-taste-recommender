<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">CineScope Studio 工作流</title>
  <desc id="desc">豆瓣记录与自然语言经过本地候选、可信媒体、多信号排序，生成今晚推荐、片库与观影雷达。</desc>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70e4dc"/>
      <stop offset=".5" stop-color="#a88cff"/>
      <stop offset="1" stop-color="#f0c277"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="26" fill="#090b12"/>
  <text x="56" y="53" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" font-weight="800" fill="#7e8ca5" letter-spacing="1.2">HOW IT WORKS / 本地推荐链路</text>
  <text x="56" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="26" font-weight="800" fill="#f6f7fb">数据、意图、证据与结果保持可追踪</text>
  <path d="M182 180H1018" stroke="#27334a" stroke-width="2"/>
  <path d="M182 180H1018" stroke="url(#flow)" stroke-width="2" stroke-dasharray="4 12"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <g transform="translate(52 128)">
      <rect width="250" height="142" rx="20" fill="#111725" stroke="#2d3a52"/>
      <circle cx="34" cy="52" r="14" fill="#70e4dc"/>
      <text x="34" y="57" text-anchor="middle" font-size="13" font-weight="900" fill="#0b1719">01</text>
      <text x="61" y="48" font-size="18" font-weight="800" fill="#f5f7fb">输入</text>
      <text x="61" y="72" font-size="13" fill="#9facbf">豆瓣看过 / 想看</text>
      <text x="61" y="94" font-size="13" fill="#9facbf">自然语言与手动焦点</text>
      <text x="24" y="122" font-size="11" fill="#66758e">公开分页优先，登录态仅由可见输入提供</text>
    </g>
    <g transform="translate(334 128)">
      <rect width="250" height="142" rx="20" fill="#111725" stroke="#3c365f"/>
      <circle cx="34" cy="52" r="14" fill="#a88cff"/>
      <text x="34" y="57" text-anchor="middle" font-size="13" font-weight="900" fill="#140e25">02</text>
      <text x="61" y="48" font-size="18" font-weight="800" fill="#f5f7fb">构建</text>
      <text x="61" y="72" font-size="13" fill="#9facbf">跨源候选与身份校验</text>
      <text x="61" y="94" font-size="13" fill="#9facbf">本地哈希媒体仓库</text>
      <text x="24" y="122" font-size="11" fill="#66758e">海报、剧照与人物图验证后再交付</text>
    </g>
    <g transform="translate(616 128)">
      <rect width="250" height="142" rx="20" fill="#111725" stroke="#65533a"/>
      <circle cx="34" cy="52" r="14" fill="#f0c277"/>
      <text x="34" y="57" text-anchor="middle" font-size="13" font-weight="900" fill="#241806">03</text>
      <text x="61" y="48" font-size="18" font-weight="800" fill="#f5f7fb">排序</text>
      <text x="61" y="72" font-size="13" fill="#9facbf">语义、口碑、主创与气质</text>
      <text x="61" y="94" font-size="13" fill="#9facbf">去重、多样性与可解释理由</text>
      <text x="24" y="122" font-size="11" fill="#66758e">本地确定性规则始终是事实源</text>
    </g>
    <g transform="translate(898 128)">
      <rect width="250" height="142" rx="20" fill="#111725" stroke="#2d3a52"/>
      <circle cx="34" cy="52" r="14" fill="#f6f7fb"/>
      <text x="34" y="57" text-anchor="middle" font-size="13" font-weight="900" fill="#111725">04</text>
      <text x="61" y="48" font-size="18" font-weight="800" fill="#f5f7fb">探索</text>
      <text x="61" y="72" font-size="13" fill="#9facbf">今晚推荐 · 片库</text>
      <text x="61" y="94" font-size="13" fill="#9facbf">口味档案 · 观影雷达</text>
      <text x="24" y="122" font-size="11" fill="#66758e">反馈可撤销，页面状态可恢复</text>
    </g>
  </g>
</svg>
