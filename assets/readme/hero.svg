    <circle cx="240" cy="188" r="42" fill="url(#gold-glow)"/>
    <circle cx="240" cy="188" r="29" fill="#111725" stroke="url(#signal)" stroke-width="3"/>
    <circle cx="240" cy="188" r="12" fill="#f4e5bf"/>
    <text x="240" y="235" text-anchor="middle" font-size="12" font-weight="800" fill="#f2d18d">多焦点交集</text>

