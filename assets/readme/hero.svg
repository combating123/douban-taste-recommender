<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">CineScope Studio</title>
  <desc id="desc">本地优先的豆瓣同步、可解释推荐与多焦点影视探索工作台。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b12"/>
      <stop offset="0.56" stop-color="#101727"/>
      <stop offset="1" stop-color="#17131a"/>
    </linearGradient>
    <radialGradient id="gold-glow">
      <stop offset="0" stop-color="#f3d89b" stop-opacity=".42"/>
      <stop offset="1" stop-color="#c8a86b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-glow">
      <stop offset="0" stop-color="#70e4dc" stop-opacity=".34"/>
      <stop offset="1" stop-color="#70e4dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70e4dc"/>
      <stop offset=".52" stop-color="#a88cff"/>
      <stop offset="1" stop-color="#f0c277"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <path d="M0 320C168 272 316 338 480 292S818 176 1200 244V400H0Z" fill="#070a11" opacity=".42"/>
  <circle cx="1000" cy="112" r="250" fill="url(#cyan-glow)"/>
  <circle cx="760" cy="306" r="230" fill="url(#gold-glow)"/>

