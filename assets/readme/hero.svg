    <text x="0" y="105" font-size="58" font-weight="860" fill="#f6f7fb" letter-spacing="-1.8">CineScope Studio</text>
    <text x="0" y="150" font-size="24" font-weight="700" fill="#dce4f3">把豆瓣记录变成可解释、可融合的私人影视策展</text>
    <text x="0" y="188" font-size="16" fill="#9ba8bd">同步看过与想看 · 自然语言选片 · 多信号排序 · 本地可信媒体</text>

    <g transform="translate(0 231)" font-size="13" font-weight="700">
      <g>
        <rect width="112" height="34" rx="17" fill="#151d2c" stroke="#33415d"/>
        <circle cx="18" cy="17" r="5" fill="#70e4dc"/>
        <text x="31" y="22" fill="#dce8f5">豆瓣同步</text>
      </g>
      <g transform="translate(122 0)">
        <rect width="130" height="34" rx="17" fill="#151d2c" stroke="#3b3562"/>
        <circle cx="18" cy="17" r="5" fill="#a88cff"/>
        <text x="31" y="22" fill="#e5ddff">可解释推荐</text>
      </g>
      <g transform="translate(262 0)">
