[project]
name = "douban-taste-recommender"
version = "0.2.0"
description = "Local-first Douban sync, explainable recommendations, trusted media, and multi-focus movie discovery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "requests[socks]>=2.31", "websocket-client>=1.8", "opencc-python-reimplemented>=0.1.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
douban-reco = "douban_recommender.cli:main"
douban-reco-web = "douban_recommender.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
douban_recommender = ["ui/**/*.html", "ui/**/*.css", "ui/**/*.js", "ui/**/*.svg"]
